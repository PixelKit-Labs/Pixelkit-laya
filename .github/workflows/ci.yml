name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Check documentation contract
        env:
          DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:docs -- "$DOCS_BASE_SHA"
      - run: npm pack --dry-run

  android-example:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/pixel-verify/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: examples/pixel-verify
      - run: npm run typecheck
        working-directory: examples/pixel-verify
      - run: npx expo prebuild --platform android --no-install
        working-directory: examples/pixel-verify
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: examples/pixel-verify/android
